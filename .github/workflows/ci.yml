name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Typecheck rollup operator scripts
        working-directory: rollup
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit -p .

  contracts:
    name: contracts (Groth16 verifier, PayoutGate v1–v3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: evm
        run: npm ci --no-audit --no-fund
      - name: Hardhat tests
        working-directory: evm
        run: npx hardhat test
